<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaChat Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Join LinguaChat</h1>
    <p>Choose your language and start chatting</p>
    <form id="registerForm">
        <label>Username</label>
        <input id="regUsername" required minlength="3" maxlength="40" autocomplete="username">
        <label>Email</label>
        <input id="regEmail" type="email" required autocomplete="email">
        <label>Password</label>
        <div class="password-wrap">
            <input id="regPassword" type="password" required minlength="6" autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="regPassword" title="Show password">&#128065;</button>
        </div>
        <label>Preferred Language</label>
        <select id="regLanguage" required>
            <option value="ENGLISH">English</option>
            <option value="TAMIL">Tamil</option>
            <option value="HINDI">Hindi</option>
            <option value="TELUGU">Telugu</option>
            <option value="MALAYALAM">Malayalam</option>
        </select>
        <button type="submit">Register</button>
        <div id="registerError" class="error"></div>
    </form>
    <a href="login.html">Already have an account?</a>
</main>
<script src="app.js"></script>
</body>
</html>
