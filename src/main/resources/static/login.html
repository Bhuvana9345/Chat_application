<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaChat Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>LinguaChat</h1>
    <p>Realtime multilingual chat</p>
    <form id="loginForm">
        <label>Username or Email</label>
        <input id="loginName" required autocomplete="username">
        <label>Password</label>
        <div class="password-wrap">
            <input id="loginPassword" type="password" required autocomplete="current-password">
            <button type="button" class="password-toggle" data-target="loginPassword" title="Show password">&#128065;</button>
        </div>
        <button type="submit">Login</button>
        <div id="loginError" class="error"></div>
    </form>
    <a href="register.html">Create new account</a>
</main>
<script src="app.js"></script>
</body>
</html>
