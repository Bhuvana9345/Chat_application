spring.application.name=LinguaChat
server.port=${PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/linguachat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${APP_JWT_KEY:${APP_JWT_SECRET:ChangeThisSecretToAtLeastThirtyTwoCharacters12345}}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# MyMemory is a free public translation endpoint. If it is unreachable,
# LinguaChat still sends and stores the message with the original text.
app.translation.url=${APP_TRANSLATION_URL:https://api.mymemory.translated.net/get?q={text}&langpair={source}%7C{target}}
